{% extends 'base.html' %}

{% block title %}{{ heading }} · Ticketing System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">{{ heading }}</h1>
    <span class="text-muted">{{ page_obj.paginator.count }} ticket{{ page_obj.paginator.count|pluralize }}</span>
</div>

<form method="get" class="card card-body shadow-sm mb-3">
    <div class="row g-2">
        <div class="col-md-3">
            <select name="property" class="form-select">
                <option value="">All properties</option>
                {% for property in properties %}
                <option value="{{ property.pk }}" {% if request.GET.property == property.pk|stringformat:"s" %}selected{% endif %}>{{ property.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <select name="category" class="form-select">
                <option value="">All categories</option>
                {% for value, label in category_choices %}
                <option value="{{ value }}" {% if request.GET.category == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <select name="priority" class="form-select">
                <option value="">All priorities</option>
                {% for value, label in priority_choices %}
                <option value="{{ value }}" {% if request.GET.priority == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <select name="status" class="form-select">
                <option value="">All statuses</option>
                {% for value, label in status_choices %}
                <option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-center gap-2">
            <div class="form-check text-nowrap me-1">
                <input class="form-check-input" type="checkbox" name="overdue" value="1" id="filter-overdue" {% if request.GET.overdue %}checked{% endif %}>
                <label class="form-check-label" for="filter-overdue">Overdue</label>
            </div>
            <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-funnel"></i> Filter</button>
            <a href="{% url 'ticket_list' %}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </div>
</form>

{% include 'tickets/_ticket_table.html' %}
{% endblock %}
